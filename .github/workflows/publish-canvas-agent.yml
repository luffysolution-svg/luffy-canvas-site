name: Publish Canvas Agent

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-canvas-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Check package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          error_log=$(mktemp)
          if npm view "$name@$version" version >/dev/null 2>"$error_log"; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" "$error_log"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$error_log" >&2
            rm -f "$error_log"
            exit 1
          fi
          rm -f "$error_log"

      - name: Publish to npm
        if: steps.package.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip existing version
        if: steps.package.outputs.should_publish != 'true'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} already exists on npm, skipping publish."
